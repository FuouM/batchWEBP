name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", ".gitignore"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Full check on the shipping platform: frontend, Tauri app, engine and CLI.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # PR jobs read the cache but never write it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Type check + vite build; the Tauri crate embeds dist/ at compile time.
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Engine and CLI on the other desktop targets (libwebp is built from source by cc).
  engine:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy -p batchwebp-core -p batchwebp-cli --all-targets -- -D warnings
      - run: cargo test -p batchwebp-core -p batchwebp-cli
